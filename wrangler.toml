name = "dropbox-classifier"
main = "src/index.ts"
compatibility_date = "2026-07-23"

# --- Storage ---------------------------------------------------------------
# D1: the `epost-ledger` database, created and owned by the epost-to-dropbox
# repository (it holds `epost_letters`; this Worker adds `jobs` and `folder_state`).
# Apply epost-to-dropbox's migrations first, then this repository's:
#   npx wrangler d1 migrations apply epost-ledger --remote
[[d1_databases]]
binding = "DB"
database_name = "epost-ledger"
database_id = "c0bdd15b-4692-4edf-9404-51702d7d1aef"
migrations_dir = "migrations"

# KV: non-critical only (cached Dropbox access token). NOT the old dropbox-to-make
# namespace: create a new one so the two Workers never share a token cache.
#   npx wrangler kv namespace create STATE
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# --- Queues: delivery hint only (24 h retention on Free) ----------------------
#   npx wrangler queues create dropbox-classifier-jobs
#   npx wrangler queues create dropbox-classifier-dlq
[[queues.producers]]
queue = "dropbox-classifier-jobs"
binding = "JOBS_QUEUE"

[[queues.consumers]]
queue = "dropbox-classifier-jobs"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "dropbox-classifier-dlq"

[[queues.consumers]]
queue = "dropbox-classifier-dlq"
max_batch_size = 10
max_retries = 3

# --- Workflow: one instance per document version --------------------------------
[[workflows]]
name = "dropbox-classifier-workflow"
binding = "CLASSIFIER_WORKFLOW"
class_name = "ClassifierWorkflow"

# Reconciliation + missed-webhook safety net.
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[observability.issues]
enabled = true

[vars]
# SAFETY: anything other than "live" is a dry run (classify + plan, no Dropbox
# write, no e-mail). Switch to "live" only at the approved cutover.
MODE = "dry_run"
# Watched inbox folder(s), non-recursive, in the namespace of the Dropbox token.
# VERIFY: see docs/GAP_ANALYSIS_AND_PLAN.md (R1).
DROPBOX_SOURCE = "/Apps/IncomingScans"
# Where processed originals go (Make: <inbox>/_sorted).
ARCHIVE_FOLDER = "/Apps/IncomingScans/_sorted"
NOTIFY_TO = "cur@brclz.ch"
GEMINI_MODEL_PRIMARY = "gemini-3.8-flash"
GEMINI_MODEL_FALLBACK = "gemini-3.5-flash-lite"
# Make used "flex". Documented for the Interactions API; verify on generateContent in staging.
GEMINI_SERVICE_TIER = "flex"
# Optional Cloudflare AI Gateway for generateContent (file upload stays direct):
#   https://gateway.ai.cloudflare.com/v1/<account_id>/<gateway_id>/google-ai-studio
# Empty = call Google directly. If the gateway requires authentication, also set the
# optional secret AI_GATEWAY_TOKEN.
GEMINI_BASE_URL = ""
GEMINI_TIMEOUT_SECONDS = "600"
SMTP_HOST = "smtp.zoho.eu"
SMTP_PORT = "465"

# Secrets are NOT stored here: `wrangler secret put <NAME>`.
[secrets]
required = [
  "DROPBOX_APP_KEY",
  "DROPBOX_APP_SECRET",
  "DROPBOX_REFRESH_TOKEN",
  "GEMINI_API_KEY",
  "SMTP_USER",
  "SMTP_PASSWORD",
  "SMTP_FROM",
]
